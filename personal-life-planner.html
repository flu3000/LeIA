<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>Personal Life Planner</title>

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Ativa dark mode por classe (controlado via JS abaixo)
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'sans-serif'],
          },
          keyframes: {
            fadeInUp: {
              '0%': { opacity: '0', transform: 'translateY(8px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            pulseSuccess: {
              '0%, 100%': { transform: 'scale(1)' },
              '50%': { transform: 'scale(1.04)' },
            },
          },
          animation: {
            'fade-in-up': 'fadeInUp 260ms ease-out both',
            'pulse-success': 'pulseSuccess 320ms ease-out',
          },
        },
      },
    };
  </script>

  <!-- Fonte Inter (tipografia moderna sans-serif) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <style>
    html, body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    body { font-family: 'Inter', system-ui, sans-serif; }

    /* Fundo com gradiente sutil (muda com o tema) */
    .app-bg {
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(59,130,246,0.12), transparent 60%),
        radial-gradient(900px 500px at 100% 0%, rgba(168,85,247,0.10), transparent 60%),
        #f8fafc;
    }
    .dark .app-bg {
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(59,130,246,0.18), transparent 60%),
        radial-gradient(900px 500px at 100% 0%, rgba(168,85,247,0.14), transparent 60%),
        #0b1220;
    }

    /* Glassmorphism — cartões e painéis */
    .glass {
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: saturate(180%) blur(14px);
      -webkit-backdrop-filter: saturate(180%) blur(14px);
      border: 1px solid rgba(15, 23, 42, 0.06);
    }
    .dark .glass {
      background: rgba(17, 24, 39, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* Scrollbar discreta */
    .nice-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
    .nice-scroll::-webkit-scrollbar-thumb { background: rgba(100,116,139,0.35); border-radius: 999px; }
    .nice-scroll::-webkit-scrollbar-thumb:hover { background: rgba(100,116,139,0.55); }

    /* Esconde seta nativa do select (ficamos com a custom) */
    select { appearance: none; -webkit-appearance: none; -moz-appearance: none; }

    /* Remove o indicador de foco padrão feio em navegadores diversos */
    :focus { outline: none; }
  </style>
</head>
<body class="min-h-screen text-slate-800 dark:text-slate-100">
  <div class="app-bg min-h-screen">
    <!-- HEADER -->
    <header class="sticky top-0 z-20 glass">
      <div class="max-w-5xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between gap-3">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-500 to-fuchsia-500 grid place-items-center shadow-md">
            <!-- Ícone calendário -->
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                 stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                 class="w-5 h-5">
              <rect x="3" y="4" width="18" height="18" rx="3"></rect>
              <path d="M16 2v4M8 2v4M3 10h18"></path>
            </svg>
          </div>
          <div>
            <h1 class="text-base sm:text-lg font-semibold tracking-tight">Personal Life Planner</h1>
            <p id="todayLabel" class="text-[11px] sm:text-xs text-slate-500 dark:text-slate-400"></p>
          </div>
        </div>

        <div class="flex items-center gap-2">
          <button id="themeToggle"
                  class="h-10 w-10 rounded-xl glass hover:scale-[1.03] active:scale-95 transition grid place-items-center"
                  aria-label="Alternar tema">
            <!-- Ícone sol -->
            <svg id="iconSun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                 class="w-5 h-5 hidden dark:block">
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
            </svg>
            <!-- Ícone lua -->
            <svg id="iconMoon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                 class="w-5 h-5 dark:hidden">
              <path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"></path>
            </svg>
          </button>

          <button id="clearDayBtn"
                  class="hidden sm:inline-flex items-center gap-2 h-10 px-3 rounded-xl glass hover:bg-rose-500/10 hover:text-rose-600 dark:hover:text-rose-400 transition text-sm font-medium"
                  aria-label="Limpar dia">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                 class="w-4 h-4">
              <path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
            </svg>
            Limpar dia
          </button>
        </div>
      </div>
    </header>

    <!-- CONTEÚDO -->
    <main class="max-w-5xl mx-auto px-4 sm:px-6 py-5 sm:py-8 pb-28 sm:pb-10">
      <div class="grid grid-cols-1 lg:grid-cols-[380px_1fr] gap-5 lg:gap-8">

        <!-- FORMULÁRIO (Dashboard) -->
        <section class="glass rounded-2xl p-4 sm:p-5 shadow-sm lg:sticky lg:top-24 h-fit">
          <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-4">
            Nova tarefa
          </h2>

          <form id="taskForm" class="space-y-3" autocomplete="off">
            <!-- Título -->
            <div>
              <label for="title" class="block text-xs font-medium text-slate-600 dark:text-slate-300 mb-1">Título</label>
              <input id="title" name="title" type="text" required maxlength="80"
                     placeholder="Ex.: Treino de pernas"
                     class="w-full h-11 px-3 rounded-xl bg-white/70 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-700 placeholder-slate-400 dark:placeholder-slate-500 focus:ring-2 focus:ring-indigo-500/60 focus:border-transparent transition" />
            </div>

            <!-- Categoria -->
            <div>
              <label for="category" class="block text-xs font-medium text-slate-600 dark:text-slate-300 mb-1">Categoria</label>
              <div class="relative">
                <select id="category" name="category" required
                        class="w-full h-11 pl-3 pr-9 rounded-xl bg-white/70 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-700 focus:ring-2 focus:ring-indigo-500/60 focus:border-transparent transition">
                  <option value="Academia">🏋️ Academia</option>
                  <option value="Trabalho">💼 Trabalho</option>
                  <option value="Estudos">📚 Estudos</option>
                  <option value="Alimentação">🍽️ Alimentação</option>
                  <option value="Descanso">🛌 Descanso</option>
                  <option value="Banho">🚿 Banho</option>
                  <option value="Outros">✨ Outros</option>
                </select>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                     class="w-4 h-4 absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-slate-400">
                  <path d="M6 9l6 6 6-6"/>
                </svg>
              </div>
            </div>

            <!-- Horários -->
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label for="start" class="block text-xs font-medium text-slate-600 dark:text-slate-300 mb-1">Início</label>
                <input id="start" name="start" type="time" required
                       class="w-full h-11 px-3 rounded-xl bg-white/70 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-700 focus:ring-2 focus:ring-indigo-500/60 focus:border-transparent transition" />
              </div>
              <div>
                <label for="end" class="block text-xs font-medium text-slate-600 dark:text-slate-300 mb-1">Fim</label>
                <input id="end" name="end" type="time" required
                       class="w-full h-11 px-3 rounded-xl bg-white/70 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-700 focus:ring-2 focus:ring-indigo-500/60 focus:border-transparent transition" />
              </div>
            </div>

            <p id="formError" class="text-xs text-rose-500 min-h-4"></p>

            <button id="submitBtn" type="submit"
                    class="w-full h-11 rounded-xl bg-gradient-to-r from-indigo-500 to-fuchsia-500 hover:from-indigo-600 hover:to-fuchsia-600 text-white font-semibold shadow-md shadow-indigo-500/20 active:scale-[0.99] transition flex items-center justify-center gap-2">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"
                   class="w-5 h-5">
                <path d="M12 5v14M5 12h14"/>
              </svg>
              <span>Adicionar</span>
            </button>
          </form>

          <!-- Botão "Limpar dia" mobile -->
          <button id="clearDayBtnMobile"
                  class="sm:hidden mt-3 w-full h-11 rounded-xl glass hover:bg-rose-500/10 hover:text-rose-600 dark:hover:text-rose-400 transition text-sm font-medium flex items-center justify-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                 class="w-4 h-4">
              <path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
            </svg>
            Limpar dia
          </button>
        </section>

        <!-- TIMELINE -->
        <section>
          <div class="flex items-end justify-between mb-4">
            <div>
              <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">
                Seu dia
              </h2>
              <p class="text-xs text-slate-400 mt-0.5">
                <span id="taskCount">0</span> tarefa(s) planejada(s)
              </p>
            </div>
          </div>

          <ul id="taskList" class="space-y-3 nice-scroll">
            <!-- tarefas renderizadas via JS -->
          </ul>

          <!-- Empty state -->
          <div id="emptyState" class="hidden">
            <div class="glass rounded-2xl p-8 text-center">
              <div class="mx-auto w-12 h-12 rounded-2xl bg-gradient-to-br from-indigo-500/20 to-fuchsia-500/20 grid place-items-center mb-3">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                     class="w-6 h-6 text-indigo-500">
                  <path d="M12 8v4l3 2"/>
                  <circle cx="12" cy="12" r="10"/>
                </svg>
              </div>
              <h3 class="font-semibold">Nenhuma tarefa ainda</h3>
              <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Adicione a primeira tarefa do seu dia para começar.</p>
            </div>
          </div>
        </section>
      </div>
    </main>

    <!-- Toast -->
    <div id="toast"
         class="pointer-events-none fixed left-1/2 -translate-x-1/2 bottom-6 z-50 opacity-0 translate-y-3 transition-all duration-300">
      <div class="glass px-4 py-2.5 rounded-xl shadow-lg text-sm font-medium flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"
             class="w-4 h-4 text-emerald-500">
          <path d="M20 6L9 17l-5-5"/>
        </svg>
        <span id="toastMsg">Tarefa adicionada</span>
      </div>
    </div>
  </div>

  <script>
    /* ------------------------------------------------------------------
     * Personal Life Planner — Vanilla JS + LocalStorage
     *
     * Persistência:
     *  - Usamos duas chaves no LocalStorage:
     *    • 'plp_tasks_v1'  → array de tarefas do usuário
     *    • 'plp_theme_v1'  → 'light' | 'dark'
     *  - Toda escrita/atualização/remoção passa por saveTasks(),
     *    que serializa o array para JSON e grava com setItem().
     *  - Na carga inicial, loadTasks() lê o JSON e reidrata o estado.
     *  - Protegemos contra JSON inválido com try/catch para nunca
     *    quebrar a UI caso o storage esteja corrompido.
     * ------------------------------------------------------------------ */

    const STORAGE_KEY = 'plp_tasks_v1';
    const THEME_KEY = 'plp_theme_v1';

    // Paleta por categoria — cor característica (borda lateral + tag)
    const CATEGORY_STYLES = {
      'Academia':     { accent: '#ef4444', soft: 'rgba(239,68,68,0.12)',  emoji: '🏋️' },
      'Trabalho':     { accent: '#3b82f6', soft: 'rgba(59,130,246,0.12)', emoji: '💼' },
      'Estudos':      { accent: '#8b5cf6', soft: 'rgba(139,92,246,0.14)', emoji: '📚' },
      'Alimentação':  { accent: '#f59e0b', soft: 'rgba(245,158,11,0.14)', emoji: '🍽️' },
      'Descanso':     { accent: '#10b981', soft: 'rgba(16,185,129,0.14)', emoji: '🛌' },
      'Banho':        { accent: '#06b6d4', soft: 'rgba(6,182,212,0.14)',  emoji: '🚿' },
      'Outros':       { accent: '#64748b', soft: 'rgba(100,116,139,0.16)', emoji: '✨' },
    };

    // ========= Estado em memória =========
    /** @type {{id:string,title:string,category:string,start:string,end:string,createdAt:number}[]} */
    let tasks = [];

    // ========= LocalStorage: leitura / escrita =========
    function loadTasks() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed : [];
      } catch (e) {
        console.warn('LocalStorage corrompido — reiniciando lista.', e);
        return [];
      }
    }

    function saveTasks() {
      // Serializa o array completo em JSON e persiste.
      // Estratégia simples: regravamos tudo a cada mudança
      // (volume de dados é pequeno: tarefas de 1 dia).
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    }

    // ========= Tema (dark/light) =========
    function applyTheme(theme) {
      const root = document.documentElement;
      if (theme === 'dark') root.classList.add('dark');
      else root.classList.remove('dark');
    }

    function initTheme() {
      const stored = localStorage.getItem(THEME_KEY);
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = stored || (prefersDark ? 'dark' : 'light');
      applyTheme(theme);
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.contains('dark');
      const next = isDark ? 'light' : 'dark';
      applyTheme(next);
      localStorage.setItem(THEME_KEY, next);
    }

    // ========= Util =========
    function uid() {
      return 't_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
    }

    function toMinutes(hhmm) {
      if (!hhmm || !/^\d{2}:\d{2}$/.test(hhmm)) return NaN;
      const [h, m] = hhmm.split(':').map(Number);
      return h * 60 + m;
    }

    function nowMinutes() {
      const d = new Date();
      return d.getHours() * 60 + d.getMinutes();
    }

    function formatTodayLabel() {
      const d = new Date();
      return d.toLocaleDateString('pt-BR', {
        weekday: 'long', day: '2-digit', month: 'long', year: 'numeric'
      });
    }

    function showToast(message) {
      const el = document.getElementById('toast');
      document.getElementById('toastMsg').textContent = message;
      el.classList.remove('opacity-0', 'translate-y-3');
      el.classList.add('opacity-100', 'translate-y-0');
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => {
        el.classList.add('opacity-0', 'translate-y-3');
        el.classList.remove('opacity-100', 'translate-y-0');
      }, 1600);
    }

    // ========= Renderização =========
    function renderTasks() {
      const list = document.getElementById('taskList');
      const empty = document.getElementById('emptyState');
      const count = document.getElementById('taskCount');

      // Ordena cronologicamente por horário de início
      const sorted = [...tasks].sort((a, b) => toMinutes(a.start) - toMinutes(b.start));

      count.textContent = sorted.length;

      if (sorted.length === 0) {
        list.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');

      const now = nowMinutes();

      list.innerHTML = sorted.map(t => {
        const style = CATEGORY_STYLES[t.category] || CATEGORY_STYLES['Outros'];
        const endMin = toMinutes(t.end);
        const isPast = !Number.isNaN(endMin) && endMin < now;

        return `
          <li data-id="${t.id}"
              class="glass rounded-2xl p-4 sm:p-5 shadow-sm animate-fade-in-up flex items-stretch gap-4 ${isPast ? 'opacity-60' : ''}">
            <!-- Barra lateral colorida -->
            <div class="w-1.5 rounded-full" style="background:${style.accent}"></div>

            <div class="flex-1 min-w-0">
              <div class="flex items-start justify-between gap-3">
                <div class="min-w-0">
                  <div class="flex items-center gap-2 flex-wrap">
                    <span class="inline-flex items-center gap-1 text-[11px] font-semibold uppercase tracking-wide px-2 py-0.5 rounded-full"
                          style="color:${style.accent}; background:${style.soft};">
                      <span>${style.emoji}</span>${t.category}
                    </span>
                    ${isPast ? '<span class="text-[10px] uppercase font-semibold tracking-wide px-2 py-0.5 rounded-full bg-slate-200 text-slate-500 dark:bg-slate-700 dark:text-slate-300">Concluída</span>' : ''}
                  </div>
                  <h3 class="mt-1.5 font-semibold text-base sm:text-[17px] leading-snug break-words ${isPast ? 'line-through decoration-slate-400/70' : ''}">
                    ${escapeHtml(t.title)}
                  </h3>
                  <p class="mt-1 text-sm text-slate-500 dark:text-slate-400 font-medium tabular-nums">
                    ${escapeHtml(t.start)} — ${escapeHtml(t.end)}
                  </p>
                </div>

                <button type="button" data-delete="${t.id}"
                        class="shrink-0 h-9 w-9 rounded-xl grid place-items-center text-slate-400 hover:text-rose-500 hover:bg-rose-500/10 transition"
                        aria-label="Excluir tarefa">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                       stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                       class="w-4 h-4">
                    <path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6"/>
                  </svg>
                </button>
              </div>
            </div>
          </li>
        `;
      }).join('');
    }

    function escapeHtml(str) {
      return String(str)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    // ========= Ações =========
    function addTask(data) {
      const task = {
        id: uid(),
        title: data.title.trim(),
        category: data.category,
        start: data.start,
        end: data.end,
        createdAt: Date.now(),
      };
      tasks.push(task);
      saveTasks();      // Persiste imediatamente no LocalStorage
      renderTasks();
    }

    function deleteTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      saveTasks();      // Persiste o estado pós-remoção
      renderTasks();
    }

    function clearDay() {
      if (tasks.length === 0) return;
      const ok = confirm('Tem certeza que deseja apagar todas as tarefas do dia?');
      if (!ok) return;
      tasks = [];
      saveTasks();      // Limpa o storage (grava array vazio)
      renderTasks();
      showToast('Dia limpo');
    }

    // ========= Bootstrap =========
    document.addEventListener('DOMContentLoaded', () => {
      initTheme();

      // Data do dia no cabeçalho
      document.getElementById('todayLabel').textContent =
        formatTodayLabel().replace(/^./, c => c.toUpperCase());

      // Carrega tarefas do LocalStorage na inicialização
      tasks = loadTasks();
      renderTasks();

      // Re-renderiza a cada minuto para atualizar marcação de "passado"
      setInterval(renderTasks, 60_000);

      // Formulário
      const form = document.getElementById('taskForm');
      const formError = document.getElementById('formError');
      const submitBtn = document.getElementById('submitBtn');

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        formError.textContent = '';

        const title = form.title.value.trim();
        const category = form.category.value;
        const start = form.start.value;
        const end = form.end.value;

        if (!title) { formError.textContent = 'Informe um título para a tarefa.'; return; }
        if (!start || !end) { formError.textContent = 'Preencha o horário de início e fim.'; return; }

        const s = toMinutes(start);
        const en = toMinutes(end);
        if (Number.isNaN(s) || Number.isNaN(en)) { formError.textContent = 'Horário inválido.'; return; }
        if (en <= s) { formError.textContent = 'O horário de fim deve ser maior que o de início.'; return; }

        addTask({ title, category, start, end });

        // Feedback visual de sucesso no botão
        submitBtn.classList.add('animate-pulse-success');
        setTimeout(() => submitBtn.classList.remove('animate-pulse-success'), 350);

        showToast('Tarefa adicionada');

        // Reseta apenas o título (mantém categoria/horário para lançamentos em série)
        form.title.value = '';
        form.title.focus();
      });

      // Delegação de clique para deletar
      document.getElementById('taskList').addEventListener('click', (e) => {
        const btn = e.target.closest('[data-delete]');
        if (!btn) return;
        const id = btn.getAttribute('data-delete');
        deleteTask(id);
        showToast('Tarefa removida');
      });

      // Limpar dia (desktop e mobile)
      document.getElementById('clearDayBtn').addEventListener('click', clearDay);
      document.getElementById('clearDayBtnMobile').addEventListener('click', clearDay);

      // Tema
      document.getElementById('themeToggle').addEventListener('click', toggleTheme);
    });
  </script>
</body>
</html>
